services:
  db:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: biblioteca
      DB_USER: biblioteca
      DB_PASSWORD: biblioteca
    depends_on:
      db:
        condition: service_healthy

  k6:
    build:
      context: .
      dockerfile: Dockerfile.k6
    profiles: ["loadtest"]
    command: run /loadtest.js
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
